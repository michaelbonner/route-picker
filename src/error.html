<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#ffffff" />
		<title>Something went wrong | Which Route Is Faster</title>
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
			}

			html {
				background: #f8fafc;
				color: #0f172b;
				-webkit-font-smoothing: antialiased;
				-webkit-tap-highlight-color: transparent;
			}

			body {
				min-height: 100vh;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					'Helvetica Neue',
					Arial,
					sans-serif;
				line-height: 1.5;
			}

			.container {
				width: 100%;
				max-width: 72rem;
				margin: 0 auto;
				padding: 0.75rem 1rem;
			}

			header {
				border-bottom: 1px solid #e2e8f0;
				background: rgba(255, 255, 255, 0.8);
			}

			.brand {
				display: inline-flex;
				align-items: center;
				gap: 0.625rem;
				min-width: 0;
				border-radius: 0.5rem;
				color: #0f172b;
				text-decoration: none;
			}

			.brand:focus-visible {
				outline: 2px solid #009689;
			}

			.brand img {
				flex-shrink: 0;
				width: 2rem;
				height: 2rem;
			}

			.brand span {
				overflow: hidden;
				white-space: nowrap;
				text-overflow: ellipsis;
				font-size: 1rem;
				font-weight: 700;
				letter-spacing: -0.025em;
			}

			main {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 6rem 1rem;
				text-align: center;
			}

			.content {
				display: flex;
				flex-direction: column;
				align-items: center;
				max-width: 28rem;
			}

			.icon {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 4rem;
				height: 4rem;
				border: 1px solid #e5e7eb;
				border-radius: 9999px;
				background: #ffffff;
				color: #d7413d;
			}

			.icon svg {
				width: 1.75rem;
				height: 1.75rem;
			}

			.status {
				margin: 2rem 0 0;
				font-size: 0.875rem;
				font-weight: 500;
				color: #6a7282;
			}

			h1 {
				margin: 0.5rem 0 0;
				font-size: 1.5rem;
				font-weight: 600;
				line-height: 2rem;
				letter-spacing: -0.025em;
			}

			.lead {
				max-width: 24rem;
				margin: 0.75rem 0 0;
				font-size: 1rem;
				line-height: 1.625;
				color: #6a7282;
			}

			.actions {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.75rem;
				width: 100%;
				margin-top: 2rem;
			}

			.button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				width: 100%;
				padding: 0.625rem 1.25rem;
				border-radius: 0.375rem;
				font: inherit;
				font-size: 0.875rem;
				font-weight: 600;
				line-height: 1.25rem;
				text-decoration: none;
				cursor: pointer;
				transition: background-color 150ms;
			}

			.button svg {
				width: 1rem;
				height: 1rem;
			}

			.button:focus-visible {
				outline: 2px solid #009689;
				outline-offset: 2px;
			}

			.primary {
				border: 1px solid transparent;
				background: #d7413d;
				color: #ffffff;
			}

			.primary:hover {
				background: #c23a36;
			}

			.secondary {
				border: 1px solid #d1d5dc;
				background: #ffffff;
				color: #364153;
			}

			.secondary:hover {
				background: #f9fafb;
			}

			footer {
				border-top: 1px solid #e2e8f0;
			}

			footer .container {
				padding-top: 1.5rem;
				padding-bottom: 1.5rem;
				font-size: 0.875rem;
				color: #62748e;
			}

			@media (min-width: 640px) {
				.brand span {
					font-size: 1.25rem;
				}

				.actions {
					flex-direction: row;
					justify-content: center;
				}

				.button {
					width: auto;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.button {
					transition: none;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<div class="container">
				<a class="brand" href="/">
					<img src="/favicon.svg" alt="" width="32" height="32" />
					<span>Which Route Is Faster</span>
				</a>
			</div>
		</header>

		<main>
			<div class="content">
				<div class="icon" aria-hidden="true">
					<svg
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.5"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path d="M12 9v4" />
						<path d="M12 17h.01" />
						<path
							d="M10.3 3.2 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0z"
						/>
					</svg>
				</div>

				<p class="status">%sveltekit.status%</p>
				<h1>Something went wrong</h1>
				<p class="lead">We hit an unexpected roadblock on our end. Please try again in a moment.</p>

				<div class="actions">
					<button class="button primary" type="button" onclick="location.reload()">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
							<path d="M21 3v5h-5" />
							<path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
							<path d="M8 16H3v5" />
						</svg>
						Try again
					</button>
					<a class="button secondary" href="/">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
							<polyline points="9 22 9 12 15 12 15 22" />
						</svg>
						Back to home
					</a>
				</div>
			</div>
		</main>

		<footer>
			<div class="container">Which Route Is Faster</div>
		</footer>
	</body>
</html>
